# ============================================================
# CI — Lint, Type-check, Unit Test, Build, E2E
# ============================================================
# Runs on every push/PR to main.
# Ensures code quality gates pass before merge.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Isolated CI database and dummy build values — real values are in Vercel
  DATABASE_URL: "postgresql://tradefeed:tradefeed@localhost:5432/tradefeed_test"
  NEXT_PUBLIC_APP_URL: "https://tradefeed.co.za"
  # Structurally valid offline key for Clerk's runtime parser; it does not
  # identify or connect to a real Clerk application.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
  CLERK_SECRET_KEY: "sk_test_dummy"
  UPLOADTHING_TOKEN: "dummy"

jobs:
  ci:
    name: Lint → Type-check → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tradefeed
          POSTGRES_PASSWORD: tradefeed
          POSTGRES_DB: tradefeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradefeed -d tradefeed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Enable PostgreSQL extensions
        run: npx prisma db execute --file prisma/ci-extensions.sql --schema prisma/schema.prisma

      # Legacy db-push/migration history cannot be replayed until it is baselined.
      - name: Synchronize test database schema
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: AI Eval (Promptfoo)
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx promptfoo eval --no-progress-bar

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tradefeed
          POSTGRES_PASSWORD: tradefeed
          POSTGRES_DB: tradefeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradefeed -d tradefeed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Enable PostgreSQL extensions
        run: npx prisma db execute --file prisma/ci-extensions.sql --schema prisma/schema.prisma

      # Legacy db-push/migration history cannot be replayed until it is baselined.
      - name: Synchronize test database schema
        run: npx prisma db push --skip-generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
